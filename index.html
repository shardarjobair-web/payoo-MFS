<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- daisy ui cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <!-- tailwind cdn -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body
    class="bg-[#F4F5F7] h-[100vh] flex flex-col justify-center items-center"
  >
    <div
      class="h-[130px] w-[300px] bg-[url(./assets/bg.png)] bg-cover flex justify-center items-center"
    >
      <img src="./assets/Group.png" alt="" />
    </div>

    <form class="w-[350px] bg-white rounded-2xl p-8">
      <div>
        <label class="font-semibold" for="">Mobile number</label>
        <br />
        <input
          type="text"
          placeholder="Enter your number" id="mobile-number"
          class="input bg-[#F4F5F7] mt-3 rounded-3xl px-5"  
        />
      </div>
      <div class="mt-5">
        <label class="font-semibold" for="">4 Digit Pin</label>
        <br />
        <input
          type="text"
          placeholder="Enter 4 Digit Pin" id="pin-number"
          class="input bg-[#F4F5F7] mt-3 rounded-3xl px-5"
        />
      </div>

      <button 
        class="btn text-white bg-[#0874F2] btn-active mt-5 w-full rounded-3xl"
      id="loginButton">Login</button>
    </form>
    <!-- js script -->
     <script src="./script.js"></script>
  </body>
</html>
